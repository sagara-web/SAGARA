<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGARA · Memuat…</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/SAGARA-logo.png">
<style>
html,body{margin:0;height:100%;background:#f4f9f5;font-family:system-ui,-apple-system,sans-serif;color:#2e7d32;display:grid;place-items:center}
.load{text-align:center}
.load img{width:64px;height:64px;object-fit:contain;animation:pop .6s cubic-bezier(.22,1,.36,1)}
.load p{margin-top:14px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;opacity:.55;font-weight:700}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
</style>
<script>
(function(){
  var target = 'desktop.html';
  try {
    var forced = localStorage.getItem('sagara-force-view');
    if (forced === 'mobile' || forced === 'desktop') {
      target = forced + '.html';
    } else {
      var ua = navigator.userAgent || '';
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
      var smallScreen = window.matchMedia && window.matchMedia('(max-width: 820px)').matches;
      var touch = window.matchMedia && window.matchMedia('(hover:none) and (pointer:coarse)').matches;
      target = (isMobileUA || (smallScreen && touch)) ? 'mobile.html' : 'desktop.html';
    }
  } catch(e){}
  window.location.replace(target);
})();
</script>
</head>
<body>
  <div class="load">
    <img src="assets/SAGARA-logo.png" alt="" onerror="this.style.display='none'">
    <p>Memuat Sagara…</p>
  </div>
</body>
</html>
